<VirtualHost *:80>
    ServerName ecodrive.solutionforge.com.br

    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass / http://127.0.0.1:8085/
    ProxyPassReverse / http://127.0.0.1:8085/

    ErrorLog /var/log/httpd/ecodrive_error.log
    CustomLog /var/log/httpd/ecodrive_access.log combined
</VirtualHost>
